[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "catalog-extraction-benchmark"
version = "0.4.0"
description = "Independent source-grounded benchmark for engineering catalog extraction"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "megamen32"}]
dependencies = ["pydantic>=2.11,<3", "pymupdf>=1.28,<2"]

[project.urls]
Homepage = "https://github.com/megamen32/catalog-extraction-benchmark"
Issues = "https://github.com/megamen32/catalog-extraction-benchmark/issues"

[project.scripts]
catalog-bench = "catalog_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.tmp/pytest"
